name: Build ChillProof

# Runs every time code is pushed to main, or when you press
# "Run workflow" on the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Add standard Android project files
        run: |
          flutter create --org uk.chillproof --project-name chillproof --platforms android "$RUNNER_TEMP/template"
          # Copy only the files we don't already have (keeps our icons, manifest and build settings).
          rsync -a --ignore-existing "$RUNNER_TEMP/template/android/" android/
          # Remove the template's duplicate MainActivity (ours lives in uk/chillproof/app).
          rm -rf android/app/src/main/kotlin/uk/chillproof/chillproof

      - name: Get packages
        run: flutter pub get

      - name: Check code (report only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Set up release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # The key file is in signing/ and is locked with KEYSTORE_PASSWORD.
          PW=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \r\n\t')
          if [ -z "$PW" ]; then
            echo "::warning::KEYSTORE_PASSWORD secret not set. The .aab will be signed with a debug key and Google Play will reject it."
            exit 0
          fi
          cp signing/upload-key.p12 android/app/upload-keystore.jks
          try() { keytool -list -keystore android/app/upload-keystore.jks -storepass "$1" -alias upload >/dev/null 2>&1; }
          if ! try "$PW"; then
            # Extra characters were pasted: look for the 28-character password inside.
            FOUND=""
            for run in $(printf '%s' "$PW" | grep -oE '[A-Za-z0-9]{28,}'); do
              n=${#run}; i=0
              while [ $((i+28)) -le $n ]; do
                cand=${run:$i:28}
                if try "$cand"; then FOUND="$cand"; break 2; fi
                i=$((i+1))
              done
            done
            if [ -z "$FOUND" ]; then
              echo "::error::KEYSTORE_PASSWORD is wrong (${#PW} characters; should be 25). Re-copy it from KEYSTORE_PASSWORD_only.txt."
              exit 1
            fi
            echo "Found the password inside the pasted text."
            PW="$FOUND"
          fi
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$PW"
            echo "keyAlias=upload"
            echo "keyPassword=$PW"
          } > android/key.properties
          echo "Signing key set up OK."

      - name: Build app bundle for Google Play (.aab)
        run: flutter build appbundle --release

      - name: Build test app you can install directly (.apk)
        run: flutter build apk --debug

      - name: Upload the Google Play file
        uses: actions/upload-artifact@v5
        with:
          name: chillproof-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload the test app
        uses: actions/upload-artifact@v5
        with:
          name: chillproof-test-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
