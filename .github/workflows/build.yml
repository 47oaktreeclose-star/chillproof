name: Build ChillProof

# Runs every time code is pushed to main, or when you press
# "Run workflow" on the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Add standard Android project files
        run: |
          flutter create --org uk.chillproof --project-name chillproof --platforms android "$RUNNER_TEMP/template"
          # Copy only the files we don't already have (keeps our icons, manifest and build settings).
          rsync -a --ignore-existing "$RUNNER_TEMP/template/android/" android/
          # Remove the template's duplicate MainActivity (ours lives in uk/chillproof/app).
          rm -rf android/app/src/main/kotlin/uk/chillproof/chillproof

      - name: Get packages
        run: flutter pub get

      - name: Check code (report only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets set. The .aab will be signed with a debug key and Google Play will reject it. See the publishing guide, Step 2."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build app bundle for Google Play (.aab)
        run: flutter build appbundle --release

      - name: Build test app you can install directly (.apk)
        run: flutter build apk --debug

      - name: Upload the Google Play file
        uses: actions/upload-artifact@v5
        with:
          name: chillproof-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload the test app
        uses: actions/upload-artifact@v5
        with:
          name: chillproof-test-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
