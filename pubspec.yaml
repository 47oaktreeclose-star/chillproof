name: chillproof
description: "ChillProof – fridge & freezer temperature logs for UK food businesses."
publish_to: 'none'

# Increase the number after the + every time you upload a new build to Google Play
# (e.g. 1.0.1+2, 1.0.2+3). Google rejects uploads that reuse a number.
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  in_app_purchase: ^3.2.0
  shared_preferences: ^2.3.0
  sqflite: ^2.4.0
  path: ^1.9.0
  path_provider: ^2.1.4
  flutter_local_notifications: ">=22.0.0 <23.0.0"
  timezone: ^0.11.0
  flutter_timezone: ^5.0.0
  pdf: ^3.11.0
  printing: ^5.13.0
  flutter_email_sender: ">=7.0.0 <12.0.0"
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Jakarta
      fonts:
        - asset: assets/fonts/PlusJakartaSans_700Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans_800ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_700Bold.ttf
          weight: 700
